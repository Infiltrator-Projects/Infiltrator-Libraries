# SPDX-License-Identifier: GPL-3.0-or-later
name: Deploy static GitHub Pages artifact
description: Configure Pages, upload one caller-built static directory, and deploy it.
inputs:
  path:
    description: Static directory to publish.
    required: true
  artifact-name:
    description: Unique Pages artifact name for this workflow attempt.
    required: true
outputs:
  page_url:
    description: Deployed Pages URL.
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}

    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: ${{ inputs.artifact-name }}
