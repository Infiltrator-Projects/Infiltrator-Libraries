# SPDX-License-Identifier: GPL-3.0-or-later
name: Philosophy adoption

on:
  push:
    branches: [main]
    paths:
      - PHILOSOPHY.md
      - docs/PHILOSOPHY.md
      - tools/check-philosophy-adoption.py
      - .github/workflows/philosophy-adoption.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify philosophy adoption across Infiltrator Projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check-philosophy-adoption.py
