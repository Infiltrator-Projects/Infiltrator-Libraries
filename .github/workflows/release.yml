# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_run:
    workflows: ["Common CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake gh zip

      - name: Validate and publish exact current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi
          tag="v${version}"

          grep -qx "#define INFILTRATR_COMMON_VERSION \"$version\"" include/infiltratr/core.h
          make clean
          make check
          make portable-check
          make shared
          test -f "build/libinfiltratr-common.so.$version"

          cmake -S . -B cmake-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_TESTS=ON \
            -DINFILTRATR_COMMON_WARNINGS_AS_ERRORS=ON
          cmake --build cmake-build --parallel
          ctest --test-dir cmake-build --output-on-failure

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          source="Infiltratr-Common-${version}-source.zip"
          git archive --format=zip --prefix="Infiltratr-Common-${version}/" --output="$source" "$head_commit"
          test -s "$source"
          sha256sum "$source" > SHA256SUMS.txt

          notes="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format='%B' "$head_commit" > "$notes"
          test -s "$notes"

          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

          release_state=$(gh release view "$tag" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' \
            2>/dev/null || true)
          if [[ -n "$release_state" ]]; then
            IFS=$'\t' read -r is_draft target_commitish <<<"$release_state"
            if [[ "$is_draft" != "true" || "$target_commitish" != "$head_commit" ]]; then
              printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --target "$head_commit" \
              --draft \
              --title "Infiltratr Common $version" \
              --notes-file "$notes"
          fi
          gh release upload "$tag" "$source" SHA256SUMS.txt --clobber

          expected_assets=$(printf '%s\n%s\n' "$source" SHA256SUMS.txt | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"
          gh release edit "$tag" --draft=false --latest
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$head_commit"
