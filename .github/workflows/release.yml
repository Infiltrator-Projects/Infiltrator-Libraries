# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang gh

      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          expected_tag="v${version}"
          if [[ "$tag" != "$expected_tag" ]]; then
            printf 'Tag %s does not match source version %s.\n' "$tag" "$version" >&2
            exit 1
          fi

          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit=$(git rev-list -n 1 "$tag")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            printf 'Tag %s points to %s, not checked-out commit %s.\n' \
              "$tag" "$tag_commit" "$head_commit" >&2
            exit 1
          fi

          grep -qx "#define INFILTRATR_COMMON_VERSION \"$version\"" \
            include/infiltratr/core.h
          make clean
          make check
          make portable-check
          make shared
          test -f "build/libinfiltratr-common.so.$version"

          notes="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format='%B' "$tag" > "$notes"
          test -s "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Existing release %s is immutable; verifying only.\n' "$tag"
          else
            gh release create "$tag" \
              --verify-tag \
              --title "Infiltratr Common $version" \
              --notes-file "$notes" \
              --latest
          fi

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          test "$published_tag" = "$tag"
