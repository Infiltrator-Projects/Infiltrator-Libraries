# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake gh

      - name: Validate exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$main_commit" ]]; then
            printf 'Release checkout %s is not current main %s.\n' \
              "$head_commit" "$main_commit" >&2
            exit 1
          fi

      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi
          tag="v${version}"
          head_commit=$(git rev-parse HEAD)

          grep -qx "#define INFILTRATR_COMMON_VERSION \"$version\"" \
            include/infiltratr/core.h
          make clean
          make check
          make portable-check
          make shared
          test -f "build/libinfiltratr-common.so.$version"

          cmake -S . -B cmake-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_TESTS=ON \
            -DINFILTRATR_COMMON_WARNINGS_AS_ERRORS=ON
          cmake --build cmake-build --parallel
          ctest --test-dir cmake-build --output-on-failure

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format='%B' "$head_commit" > "$notes"
          test -s "$notes"

          git tag "$tag" "$head_commit"
          git push origin "$tag"

          gh release create "$tag" \
            --verify-tag \
            --target "$head_commit" \
            --title "Infiltratr Common $version" \
            --notes-file "$notes" \
            --latest

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          test "$published_tag" = "$tag"
