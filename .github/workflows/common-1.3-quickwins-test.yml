name: Common 1.3.0 quick-win validation

on:
  push:
    branches:
      - common-1.3-capability-quickwins

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make clean
          make check CC=${{ matrix.compiler }}
          make shared CC=${{ matrix.compiler }}
      - name: Verify version and shared output
        run: |
          test "$(cat VERSION)" = "1.3.0"
          test -f build/libinfiltratr-common.so.1.3.0
